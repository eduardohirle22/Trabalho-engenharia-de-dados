name: "urbanflow"
version: "2.0.0"
config-version: 2

profile: "urbanflow"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  urbanflow:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

vars:
  silver_dir: "{{ env_var('URBANFLOW_SILVER_DIR', '../data/silver') }}"
  gold_db:    "{{ env_var('URBANFLOW_GOLD_DIR', '../data/gold') }}/urbanflow.duckdb"
