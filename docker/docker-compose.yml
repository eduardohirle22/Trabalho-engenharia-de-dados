version: "3.9"

# ─── UrbanFlow Data Platform ────────────────────────────────────────────────
# Sobe toda a stack com: docker compose up -d
# Requisitos: Docker 24+, ~3 GB RAM livre
# ────────────────────────────────────────────────────────────────────────────

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nIe3aI="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "urbanflow-secret-2026"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    # MinIO / S3
    MINIO_ENDPOINT: "http://minio:9000"
    MINIO_ACCESS_KEY: "minioadmin"
    MINIO_SECRET_KEY: "minioadmin123"
    # Postgres legado
    POSTGRES_LEGADO_HOST: "postgres"
    POSTGRES_LEGADO_DB: "urbanflow_legado"
    POSTGRES_LEGADO_USER: "urbanflow"
    POSTGRES_LEGADO_PASSWORD: "urbanflow123"
    # Paths internos
    SILVER_DIR: "/opt/airflow/data/silver"
    GOLD_DIR: "/opt/airflow/data/gold"
  volumes:
    - ../orchestration/dags:/opt/airflow/dags
    - ../ingestao:/opt/airflow/ingestao
    - ../dbt_project:/opt/airflow/dbt_project
    - airflow-logs:/opt/airflow/logs
    - airflow-data:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  # Dupla função: banco legado (urbanflow_legado) + metadados do Airflow (airflow)
  postgres:
    image: postgres:15-alpine
    container_name: urbanflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      POSTGRES_MULTIPLE_DATABASES: "urbanflow_legado"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../ingestao/init_postgres.sql:/docker-entrypoint-initdb.d/01_init_legado.sql
      - ./init_multi_db.sh:/docker-entrypoint-initdb.d/00_init_multi.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ─── MinIO ──────────────────────────────────────────────────────────────────
  # Object storage S3-compatível — camadas Bronze, Silver, Gold
  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: urbanflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ─── MinIO Init ─────────────────────────────────────────────────────────────
  # Cria os buckets na primeira inicialização
  minio-init:
    image: minio/mc:RELEASE.2024-04-29T09-56-05Z
    container_name: urbanflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123;
        mc mb --ignore-existing local/urbanflow-bronze;
        mc mb --ignore-existing local/urbanflow-silver;
        mc mb --ignore-existing local/urbanflow-gold;
        mc mb --ignore-existing local/urbanflow-quarentena;
        mc anonymous set download local/urbanflow-gold;
        echo '✅ Buckets criados: bronze | silver | gold | quarentena';
      "
    restart: "no"

  # ─── Airflow Init ───────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: urbanflow-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname UrbanFlow \
          --role Admin \
          --email admin@urbanflow.local \
          --password admin123
        echo "✅ Airflow inicializado"
    restart: "no"

  # ─── Airflow Webserver ──────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: urbanflow-airflow-web
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─── Airflow Scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: urbanflow-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─── API de Serving ─────────────────────────────────────────────────────────
  # FastAPI + DuckDB lendo Parquet do Silver/Gold
  api:
    build:
      context: ../serving
      dockerfile: Dockerfile
    container_name: urbanflow-api
    environment:
      SILVER_DIR: "/data/silver"
      GOLD_DIR: "/data/gold"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"
    volumes:
      - airflow-data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
  airflow-data:
